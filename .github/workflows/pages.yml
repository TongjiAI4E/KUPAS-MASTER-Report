name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/dist/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Check publish directory
        run: |
          test -s website/dist/index.html
          test -s website/dist/sitemap.xml
          test -s website/dist/assets/reports/KUPAS-MASTER-Technical-Report-ZH.pdf
          test -s website/dist/assets/reports/KUPAS-MASTER-Technical-Report-EN.pdf
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
